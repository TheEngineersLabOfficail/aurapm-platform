apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-issue-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-issue-service
  template:
    metadata:
      labels:
        app: core-issue-service
    spec:
      containers:
        - name: core-engine
          image: core-issue-service:latest
          imagePullPolicy: Never # Uses our local cached build
          ports:
            - containerPort: 8081
          env:
            - name: DB_HOST
              value: "aurapm-db" # Resolves instantly to our K8s Postgres service
            - name: DB_PORT
              value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: core-issue-service
spec:
  type: NodePort # Exposes the port outside the internal cluster network to your Mac host
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081 # Fixes the external routing connection port
  selector:
    app: core-issue-service
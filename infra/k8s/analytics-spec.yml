apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-analytics-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predictive-analytics
  template:
    metadata:
      labels:
        app: predictive-analytics
    spec:
      containers:
        - name: analytics-engine
          image: predictive-analytics:latest
          imagePullPolicy: Never # Forces K8s to use the local cache we side-loaded
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: predictive-analytics # Crucial: This serves as the cluster internal DNS name
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: predictive-analytics
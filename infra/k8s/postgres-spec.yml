apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurapm-db-deployment
spec:
  replicas: 1 # We only need one master instance for local storage consistency
  selector:
    matchLabels:
      app: aurapm-db
  template:
    metadata:
      labels:
        app: aurapm-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "aurapm_admin"
            - name: POSTGRES_PASSWORD
              value: "supersecretpassword"
            - name: POSTGRES_DB
              value: "aurapm_core"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aurapm-db # The exact internal DNS name our Java app will call!
spec:
  type: ClusterIP # Keeps the database hidden securely inside the cluster network
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: aurapm-db